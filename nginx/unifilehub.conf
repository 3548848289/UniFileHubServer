server {
    listen 80;

    root /var/www/unifilehub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /user-api/ {
        proxy_pass http://127.0.0.1:5001/;
    }

    location /drive-api/ {
        proxy_pass http://127.0.0.1:5005/;
    }

    location /clipboard-api/ {
        proxy_pass http://127.0.0.1:5006/;
    }
}